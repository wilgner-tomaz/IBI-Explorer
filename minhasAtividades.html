<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" href="images/nature/Homem.jpeg" type="image/gif" />

    <title>IBI-EXPLORER - Minhas Atividades</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/feedUsuario.css" />
  </head>

  <body class="py-4">
    <div class="container" style="max-width: 960px">
      
      <header class="d-flex align-items-center justify-content-between p-3 px-4 rounded-4 mb-4 header-panel">
        <h1 class="h4 m-0 fw-bold brand-title d-flex align-items-center gap-2">
          <i class="bi bi-compass-fill icon-brand"></i>
          <span>IBI-EXPLORER</span>
        </h1>
        <button id="btnLogout" class="btn btn-logout btn-sm fw-semibold d-flex align-items-center gap-2">
          <i class="bi bi-box-arrow-right"></i>
          <span>Sair</span>
        </button>
      </header>

      <div class="mb-3">
        <a href="feedUsuario.html" class="btn btn-sm btn-outline-secondary fw-semibold rounded-3">
          <i class="bi bi-arrow-left"></i> Voltar ao Feed
        </a>
      </div>

      <main class="card card-custom mb-4">
        <div class="card-body p-4">
          <h2 class="h5 card-section-title mb-4">
            <i class="bi bi-journal-check me-2"></i>Minhas Atividades
          </h2>

          <div id="containerMinhasAtividades">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
              <span>Carregando suas atividades...</span>
            </div>
          </div>
        </div>
      </main>

    </div>

    <div class="modal fade" id="modalEditarAtividade" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold text-primary">Editar Exploração</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            
            <div class="p-3 bg-light rounded-3 mb-3 d-flex justify-content-between text-center border">
              <div><small class="text-muted d-block">Distância</small><strong id="summaryDist">0</strong> KM</div>
              <div><small class="text-muted d-block">Tempo</small><strong id="summaryTime">0</strong> MIN</div>
              <div><small class="text-muted d-block">Elevação</small><strong id="summaryElev">0</strong> M</div>
            </div>

            <input type="hidden" id="editAtividadeId" />

            <div class="mb-3">
              <label class="form-label fw-semibold">Descrição do Treino / Rota:</label>
              <textarea id="txtModalDescricao" class="form-control" rows="2" placeholder="Como foi sua atividade?"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Adicionar Foto ou Vídeo:</label>
              <input type="file" id="mediaInput" class="form-control" accept="image/*,video/*">
            </div>

          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-primary-custom w-100 fw-bold" id="btnConfirmSaveEdit">
              SALVAR ALTERAÇÕES
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/minhasAtividades.js"></script>
  </body>
</html>
